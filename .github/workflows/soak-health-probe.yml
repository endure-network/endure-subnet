name: Soak health probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: Testnet readiness and release identity
    runs-on: ubuntu-latest
    steps:
      - name: Require the deployed staging identity to be healthy
        env:
          SOAK_EXPECTED_SHA: ${{ vars.SOAK_EXPECTED_SHA }}
          SOAK_EXPECTED_PROTOCOL_KEY: ${{ vars.SOAK_EXPECTED_PROTOCOL_KEY }}
          SOAK_EXPECTED_CONTENT_REVISION: ${{ vars.SOAK_EXPECTED_CONTENT_REVISION }}
        run: |
          set -euo pipefail
          [[ "$SOAK_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Release identity must be explicit: a fallback key silently goes
          # stale on the next protocol bump and turns the soak gate into a
          # false negative. Set the repo variable alongside SOAK_EXPECTED_SHA.
          : "${SOAK_EXPECTED_PROTOCOL_KEY:?SOAK_EXPECTED_PROTOCOL_KEY repo variable must be set}"
          expected_key="$SOAK_EXPECTED_PROTOCOL_KEY"
          [[ "$expected_key" =~ ^[0-9]+$ ]]
          # source_revision/image_version are builder-attested build args; only
          # content_revision hashes the sources actually running, so a stale
          # image carrying correct build args fails here and nowhere else.
          # Record the value at release time: python -m scripts.content_revision
          : "${SOAK_EXPECTED_CONTENT_REVISION:?SOAK_EXPECTED_CONTENT_REVISION repo variable must be set}"
          [[ "$SOAK_EXPECTED_CONTENT_REVISION" =~ ^[0-9a-f]{64}$ ]]
          body="$(
            curl --fail --show-error --silent --retry 3 --retry-all-errors \
              --retry-delay 5 --connect-timeout 10 --max-time 20 \
              https://api.testnet.endure.network/health
          )"
          # `.status` already rolls up loop/tick/failure-counter/RPC health
          # server-side (endure/api/app.py) as a 503 that curl --fail rejects,
          # so asserting those runtime fields here would be redundant. Restart
          # detection is deliberately absent: it needs sampling faster than the
          # recovery window, and GitHub schedules are best-effort -- observed
          # gaps here run 105-305 min against "*/5". Use an external /live
          # monitor for liveness.
          jq --exit-status --arg sha "$SOAK_EXPECTED_SHA" \
            --arg content "$SOAK_EXPECTED_CONTENT_REVISION" \
            --argjson key "$expected_key" '
            .status == "ok"
            and .schema_id == "risk.v1.subnet_alpha"
            and .protocol_version_key == $key
            and .source_revision == $sha
            and .image_version == ("sha-" + $sha)
            and .content_revision == $content
          ' <<<"$body"
