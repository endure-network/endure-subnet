name: Soak health probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: Testnet liveness endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the public validator liveness endpoint is unavailable
        run: >-
          curl --fail --show-error --silent --retry 3 --retry-all-errors
          --retry-delay 5 --connect-timeout 10 --max-time 20
          https://api.testnet.endure.network/live
