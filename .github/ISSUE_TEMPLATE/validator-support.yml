name: Validator support
description: Get non-sensitive help operating a testnet validator.
body:
  - type: textarea
    attributes:
      label: Command and expected/actual behavior
      description: Include reproducible commands and expected/actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versions, redacted configuration, and logs
      description: Include release, protocol key, Bittensor version, redacted config, and redacted logs. Never include wallet material, tokens, backup contents, or credentials.
    validations:
      required: true
