name: endure-adaptive-mainnet-three-miners

# Each registered hotkey has its own wallet mount, axon port, and commit state.
# UID is assigned by the chain; it is not a miner startup argument.
x-miner: &miner
  image: "${MINER_IMAGE:?set MINER_IMAGE to a qualified adaptive-miner tag or digest}"
  pull_policy: always
  restart: unless-stopped
  stop_grace_period: 45s
  init: true
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import os,socket;s=socket.create_connection(('127.0.0.1',int(os.environ['MINER_AXON_PORT'])),timeout=5);s.close()
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 2700s

services:
  miner-1:
    <<: *miner
    environment:
      MINER_AXON_PORT: "8092"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MINER1_WALLET_ROOT:?set MINER1_WALLET_ROOT}:/root/.bittensor/wallets:ro
      - miner-1-state:/root/.bittensor/miners
    ports:
      - "8092:8092"
    command:
      - --netuid
      - "${NETUID:?set NETUID}"
      - --subtensor.network
      - "${CHAIN:?set CHAIN}"
      - --wallet.name
      - "${MINER1_WALLET:?set MINER1_WALLET}"
      - --wallet.hotkey
      - "${MINER1_HOTKEY:?set MINER1_HOTKEY}"
      - --endure.active_schema
      - risk.v1.subnet_alpha
      - --endure.serving_stage
      - "${SERVING_STAGE:?set SERVING_STAGE}"
      - --endure.market_data_endpoint
      - "${MARKET_DATA_ENDPOINT:-wss://archive.chain.opentensor.ai:443}"
      - --axon.port
      - "8092"
      - --axon.external_ip
      - "${EXTERNAL_IP:?set EXTERNAL_IP}"
      - --logging.info

  miner-2:
    <<: *miner
    environment:
      MINER_AXON_PORT: "8093"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MINER2_WALLET_ROOT:?set MINER2_WALLET_ROOT}:/root/.bittensor/wallets:ro
      - miner-2-state:/root/.bittensor/miners
    ports:
      - "8093:8093"
    command:
      - --netuid
      - "${NETUID:?set NETUID}"
      - --subtensor.network
      - "${CHAIN:?set CHAIN}"
      - --wallet.name
      - "${MINER2_WALLET:?set MINER2_WALLET}"
      - --wallet.hotkey
      - "${MINER2_HOTKEY:?set MINER2_HOTKEY}"
      - --endure.active_schema
      - risk.v1.subnet_alpha
      - --endure.serving_stage
      - "${SERVING_STAGE:?set SERVING_STAGE}"
      - --endure.market_data_endpoint
      - "${MARKET_DATA_ENDPOINT:-wss://archive.chain.opentensor.ai:443}"
      - --axon.port
      - "8093"
      - --axon.external_ip
      - "${EXTERNAL_IP:?set EXTERNAL_IP}"
      - --logging.info

  miner-3:
    <<: *miner
    environment:
      MINER_AXON_PORT: "8094"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MINER3_WALLET_ROOT:?set MINER3_WALLET_ROOT}:/root/.bittensor/wallets:ro
      - miner-3-state:/root/.bittensor/miners
    ports:
      - "8094:8094"
    command:
      - --netuid
      - "${NETUID:?set NETUID}"
      - --subtensor.network
      - "${CHAIN:?set CHAIN}"
      - --wallet.name
      - "${MINER3_WALLET:?set MINER3_WALLET}"
      - --wallet.hotkey
      - "${MINER3_HOTKEY:?set MINER3_HOTKEY}"
      - --endure.active_schema
      - risk.v1.subnet_alpha
      - --endure.serving_stage
      - "${SERVING_STAGE:?set SERVING_STAGE}"
      - --endure.market_data_endpoint
      - "${MARKET_DATA_ENDPOINT:-wss://archive.chain.opentensor.ai:443}"
      - --axon.port
      - "8094"
      - --axon.external_ip
      - "${EXTERNAL_IP:?set EXTERNAL_IP}"
      - --logging.info

volumes:
  miner-1-state:
  miner-2-state:
  miner-3-state:
