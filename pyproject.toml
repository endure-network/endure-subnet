[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "endure"
version = "0.1.0rc1"
description = "Endure — Bittensor risk-intelligence subnet"
readme = "README.md"
license = "MIT"
authors = [{ name = "Endure Network" }]
requires-python = ">=3.12,<3.13"

# Runtime deps. Pins chosen to match previously validated versions
# while allowing patch-level absorption. Upgrade in a dedicated PR.
dependencies = [
    # Bittensor chain + substrate. We do NOT depend on py-substrate-interface,
    # whose scalecodec collides with cyscale.
    "bittensor>=10.5,<11",
    "async-substrate-interface>=2.0.4,<3",

    # Data validation
    "pydantic>=2,<2.13",

    # NYSE trading calendar (spec §2: close-relative round
    # windows). Session boundaries are protocol-relevant; bump deliberately.
    "exchange-calendars>=4.5,<5",

    # Storage (spec §10: SQLite + Alembic)
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # HTTP surface (spec §9: validator HTTP for signed blob retrieval)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "starlette>=0.30.0",
    "numpy>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "pytest-alembic>=0.11",
    "httpx2>=2.7,<3",  # FastAPI/starlette TestClient transport for read-API tests
    "anyio>=4,<5",
    "ruff>=0.15.10,<0.16",
    "pyright>=1.1.406",
    "pylint>=3",  # duplicate-code detection via R0801
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://endure.network/"
Repository = "https://github.com/endure-network/endure-subnet"
Documentation = "https://github.com/endure-network/endure-subnet/blob/main/docs/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["endure*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"endure.protocol" = ["activated_versions.json"]

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Bittensor / substrate emit deprecation warnings we can't control
    "ignore::DeprecationWarning:bittensor.*",
    "ignore::DeprecationWarning:substrateinterface.*",
    "ignore::DeprecationWarning:scalecodec.*",
]

[tool.coverage.run]
source = ["endure"]
branch = true
omit = [
    "endure/storage/migrations/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "C901", "PLR"]
ignore = [
    "E501",   # line-length enforced by ruff format
    "B905",   # zip-without-explicit-strict — adopt incrementally
]

[tool.ruff.lint.mccabe]
max-complexity = 15  # Reviewed complexity ceiling for production code.

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, tmp paths, subprocess fixtures, and magic numbers.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "B008", "F841", "PLR2004", "PLR0913", "PLR0915", "PLR0917"]
# Neuron entry points contain intentionally broad lifecycle orchestration.
"neurons/**" = ["S101", "F821", "PLR0912", "PLR0915"]
# Transport lifecycle methods take explicit SDK parameters.
"endure/base/**" = ["PLR1722", "PLR0913"]
"endure/base/utils/weight_utils.py" = ["B007", "PLR0911", "PLR0913", "PLR0915", "PLR0917"]
"endure/utils/__init__.py" = ["F401"]
# Verdict functions inject clock/window/state as explicit keyword args by
# design (clock-free purity); each rejection path is its own return.
"endure/protocol/validation.py" = ["PLR0911", "PLR0912", "PLR0913"]
# Repository mutations take row fields as explicit keyword args.
"endure/storage/repository.py" = ["PLR0913"]
"endure/scoring/risk/orchestrator.py" = ["PLR0913"]
# Round services take their collaborators as explicit keyword injections.
"endure/protocol/validator_service.py" = ["PLR0913"]
"endure/protocol/miner_service.py" = ["PLR0913"]
"endure/utils/config.py" = ["S110", "S603", "S607"]
"endure/runtime/mock.py" = ["B008", "S311", "PLR0913", "PLR0917"]
# Alembic migrations are autogenerated — relax all complexity rules
"endure/storage/migrations/versions/**" = ["E", "F", "I", "B", "S", "C901", "PLR"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------
# Pyright
# ----------------------------------------------------------------------------
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["endure", "neurons", "scripts", "verify"]
# Hand-curated bittensor stub lives in typings/bittensor/ — it's what
# lets pyright catch pre-v10 lowercase-API drift (bt.wallet/bt.axon/etc.)
# as real type errors instead of silently-Unknown returns.
stubPath = "typings"
# Point pyright at the venv so it can resolve installed packages (numpy
# ships py.typed, bittensor doesn't — we supply our own stub for the latter).
venvPath = "."
venv = ".venv"
exclude = [
    "**/tests/**",
    "**/node_modules/**",
    "**/.venv/**",
    "endure/storage/migrations/**",
]
extraPaths = ["."]
reportMissingTypeStubs = false
# reportMissingModuleSource is demoted to warning because bittensor ships
# no py.typed marker — pyright finds it via our stub but can't locate
# "source" for it. This is expected and not actionable.
reportMissingModuleSource = "warning"
reportMissingImports = true
reportPrivateImportUsage = true
reportOptionalMemberAccess = true
reportAttributeAccessIssue = true
reportArgumentType = true
reportGeneralTypeIssues = true
